# Dataset-generation config: coder only, no judge, validation-gated output.
#
# Differences from the competition configuration.yaml:
#   - coder is swift-heron-2's model on vLLM, spread dp=4 across GPUs 0-3
#     (one replica per GPU) instead of one SGLang replica on GPU 0
#   - judge/critic client is off; actors.judge.enabled=false skips the bracket,
#     so the two candidates per prompt are generated and validated but not ranked
#   - embedder off (it only feeds the judge's best-view stage)
#   - judge/critic actors point at the coder client purely so the factory can
#     construct them; neither is ever invoked (refinement is off, judge disabled)
api:
  host: "0.0.0.0"
  port: 10006
  debug: true

pipeline:
  batch_time_budget: 14400
  prompt_timeout: 600.0
  use_planner: false
  render_from_object: true
  refinement_enabled: false
  seed_offset: 1000003
  coder_probe:
    enabled: true
    concurrency: 48
    max_tokens: 512
    min_tps: 0

preflight:
  min_tflops: 30
  min_stream48_gbps: 0
  min_power_limit_w: 0

benchmark: true
warmup: true

llm_clients:
  openrouter:
    enabled: false
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
  coder-instance:
    enabled: true
    base_url: "http://localhost:8001/v1"
    api_key: "local"
    vllm:
      engine: "vllm"
      model: "cont1037/Qwen-3.6-27B-SwiftHeron"
      revision: "02a17ef4359816d7d2a640bd0b01baadcdb3dead"
      # One replica per GPU across all four cards.
      gpu_ids: "0,1,2,3"
      tensor_parallel_size: 1
      data_parallel_size: 4
      vllm_bin: "/opt/vllm-glm-env/bin/vllm"
      gpu_memory_utilization: 0.9
      max_model_len: 81920
      max_num_seqs: 256
      extra_args: ["--speculative-config", "{\"method\":\"mtp\",\"num_speculative_tokens\":2}"]
  judge-critic-instance:
    enabled: false
    base_url: "http://localhost:8002/v1"
    api_key: "local"

embedder:
  enabled: false
  model_id: "cont1037/dinov3-vits16-pretrain-lvd1689m"
  revision: "ba4586919549aa692fd9b39ab3e9777c564b497d"

actors:
  planner:
    client: "coder-instance"
    model: "cont1037/Qwen-3.6-27B-SwiftHeron"
    workers: 256
    queue_size: 128
    max_tokens: 32768
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    seed: 42
    reasoning_effort: "medium"
    enable_thinking: false
    providers:
      order: []
      allow_fallbacks: true
  coder:
    client: "coder-instance"
    model: "cont1037/Qwen-3.6-27B-SwiftHeron"
    workers: 256
    queue_size: 256
    max_tokens: 24576
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    seed: 42
    enable_thinking: false
    multimodal: true
    ensemble_size: 2
    ensemble_temperature: 0.6
    providers:
      order: []
      allow_fallbacks: true
  patcher:
    workers: 64
    queue_size: 64
  critic:
    # Never invoked (refinement_enabled=false); points at the coder client only
    # so the factory can construct it without the judge-critic endpoint.
    client: "coder-instance"
    model: "cont1037/Qwen-3.6-27B-SwiftHeron"
    workers: 8
    queue_size: 8
    max_tokens: 6144
    temperature: 0.6
    seed: 42
    enable_thinking: false
    ensemble_size: 1
    providers:
      order: []
      allow_fallbacks: true
  judge:
    enabled: false
    client: "coder-instance"
    model: "cont1037/Qwen-3.6-27B-SwiftHeron"
    workers: 8
    queue_size: 8
    max_tokens: 8192
    temperature: 0.0
    seed: 42
    providers:
      order: []
      allow_fallbacks: true
  checker:
    workers: 64
    queue_size: 64
  renderer:
    workers: 32
    queue_size: 64

event_bus:
  max_iter: 2
  task_deadline_s: 3600
  score_threshold: 0.55

js_checker:
  execution_timeout_ms: 5000
  node_binary: "node"

renderer:
  sidecar_host: "127.0.0.1"
  sidecar_port: 8003
  startup_timeout_s: 60.0
  request_timeout_s: 90.0
  node_binary: "node"
  img_size: 1024
  grid_gap: 5
  bg_color: null
  lighting: neutral
  sidecar_count: 8
  pool_size: 2
  render_timeout_ms: 60000
  protocol_timeout_ms: 60000
