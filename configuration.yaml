api:
  host: "0.0.0.0"
  port: 10006
  debug: true

pipeline:
  batch_time_budget: 14400
  prompt_timeout: 600.0
  use_planner: false
  render_from_object: true
  refinement_enabled: false
  seed_offset: 1000003
  coder_probe:
    enabled: true
    concurrency: 48
    max_tokens: 512
    min_tps: 0

preflight:
  min_tflops: 30
  min_stream48_gbps: 0
  min_power_limit_w: 0

benchmark: true
warmup: true

llm_clients:
  openrouter:
    enabled: false
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
  coder-instance:
    enabled: true
    base_url: "http://localhost:8001/v1"
    api_key: "local"
    vllm:
      engine: "sglang"
      model: "cont1037/Qwen-3.6-27B-SwiftHeron"
      revision: "02a17ef4359816d7d2a640bd0b01baadcdb3dead"
      gpu_ids: "0"
      tensor_parallel_size: 1
      data_parallel_size: 1
      engine_python: "/opt/sglang-env/bin/python"
      gpu_memory_utilization: 0.9
      max_model_len: 81920
      max_num_seqs: 256
      speculative:
        algorithm: "DFLASH"
        draft_model: "cont1037/Qwen3.6-27B-DFlash-SwiftHeron"
        draft_revision: "84de9b233515579677a7e997c23245407797a1f5"
        num_draft_tokens: 8
      env:
        SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK: "1"
      extra_args:
        - "--mamba-radix-cache-strategy"
        - "extra_buffer_lazy"
        - "--mamba-ssm-dtype"
        - "bfloat16"
        - "--enable-metrics"
        - "--random-seed"
        - "42"
  judge-critic-instance:
    enabled: true
    base_url: "http://localhost:8002/v1"
    api_key: "local"
    vllm:
      engine: "vllm"
      model: "zai-org/GLM-4.6V-Flash"
      revision: "411bb4d77144a3f03accbf4b780f5acb8b7cde4e"
      gpu_ids: "1,2,3"
      tensor_parallel_size: 1
      data_parallel_size: 3
      gpu_memory_utilization: 0.9
      max_model_len: 81920
      max_num_seqs: 64
      extra_args: ["--max-num-batched-tokens", "16384"]
      vllm_bin: "/opt/vllm-glm-env/bin/vllm"
      trust_remote_code: true
      reasoning_parser: null

embedder:
  model_id: "cont1037/dinov3-vits16-pretrain-lvd1689m"
  revision: "ba4586919549aa692fd9b39ab3e9777c564b497d"

actors:
  planner:
    client: "coder-instance"
    model: "cont1037/Qwen-3.6-27B-SwiftHeron"
    workers: 256
    queue_size: 128
    max_tokens: 32768
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    seed: 42
    reasoning_effort: "medium"
    enable_thinking: false
    providers:
      order: []
      allow_fallbacks: true
  coder:
    client: "coder-instance"
    model: "cont1037/Qwen-3.6-27B-SwiftHeron"
    workers: 48
    queue_size: 64
    max_tokens: 24576
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    seed: 42
    enable_thinking: false
    multimodal: true
    ensemble_size: 38
    ensemble_temperature: 0.6
    providers:
      order: []
      allow_fallbacks: true
  patcher:
    workers: 64
    queue_size: 64
  critic:
    client: "judge-critic-instance"
    model: "zai-org/GLM-4.6V-Flash"
    workers: 128
    queue_size: 64
    max_tokens: 6144
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.0
    seed: 42
    reasoning_effort: "medium"
    enable_thinking: false
    ensemble_size: 1
    providers:
      order: []
      allow_fallbacks: true
  judge:
    client: "judge-critic-instance"
    model: "zai-org/GLM-4.6V-Flash"
    workers: 48
    queue_size: 48
    max_tokens: 8192
    temperature: 0.0
    seed: 42
    providers:
      order: []
      allow_fallbacks: true
  checker:
    workers: 32
    queue_size: 32
  renderer:
    workers: 16
    queue_size: 32

event_bus:
  max_iter: 2
  task_deadline_s: 3600
  score_threshold: 0.55

js_checker:
  execution_timeout_ms: 5000
  node_binary: "node"

renderer:
  sidecar_host: "127.0.0.1"
  sidecar_port: 8003
  startup_timeout_s: 60.0
  request_timeout_s: 90.0
  node_binary: "node"
  img_size: 1024
  grid_gap: 5
  bg_color: null
  lighting: neutral
  sidecar_count: 8
  pool_size: 2
  render_timeout_ms: 60000
  protocol_timeout_ms: 60000
